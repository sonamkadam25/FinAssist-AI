spring.application.name=FinAssist
server.port=8080

# database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finassistdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Ollama AI configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:codellama:latest}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.7}
finassist.reporting-zone=${FINASSIST_REPORTING_ZONE:UTC}
